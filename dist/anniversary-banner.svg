<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="46%" stop-color="#fff2f6"/>
      <stop offset="100%" stop-color="#f8dce7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f611f"/>
      <stop offset="26%" stop-color="#d5b066"/>
      <stop offset="50%" stop-color="#fff1c9"/>
      <stop offset="72%" stop-color="#d2a34d"/>
      <stop offset="100%" stop-color="#845416"/>
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef8faf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ef8faf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#9d4a68" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1400" height="800" rx="44" fill="url(#bg)"/>
  <rect width="1400" height="800" rx="44" fill="url(#roseGlow)"/>
  <rect x="24" y="24" width="1352" height="752" rx="34" fill="none" stroke="#c89b46" stroke-opacity="0.34" stroke-width="2"/>
  <rect x="42" y="42" width="1316" height="716" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="2"/>

  <g opacity="0.35" fill="#c89b46">
    <circle cx="135" cy="118" r="4"/><circle cx="245" cy="208" r="3"/><circle cx="1120" cy="142" r="4"/>
    <circle cx="1250" cy="258" r="3"/><circle cx="1080" cy="650" r="3"/><circle cx="300" cy="650" r="4"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" filter="url(#shadow)">
    <text x="700" y="248" font-size="48" letter-spacing="9" fill="#b47b2d">OUR LITTLE FOREVER</text>
    <text x="700" y="390" font-size="112" font-weight="700" fill="url(#gold)">Happy Anniversary</text>
    <text x="700" y="505" font-size="76" font-style="italic" fill="#c54d79">My Little Princess</text>
  </g>

  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#7c5b66">
    <text x="700" y="590" font-size="30" letter-spacing="2">Every chapter is better because it has you in it.</text>
    <text x="700" y="645" font-size="24" opacity="0.88">With all my love — today, tomorrow, always.</text>
  </g>

  <g font-size="62">
    <text x="105" y="710">🌹</text><text x="1210" y="110">🌹</text><text x="1160" y="700">🌸</text><text x="160" y="160">💮</text>
  </g>

  <path d="M525 690 C600 645 800 645 875 690" fill="none" stroke="#c89b46" stroke-width="3" opacity="0.55"/>
  <text x="700" y="730" text-anchor="middle" font-size="34" fill="#c89b46">♡</text>
</svg>
